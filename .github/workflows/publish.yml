name: Publish Packages

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  setup:
    name: Setup environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.12.0
      
  publish-python:
    name: Build and Publish Python Package
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      id-token: write  # For PyPI publishing with trusted publishing
    
    steps:
      - uses: ./.github/actions/setup

      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ env.GITHUB_REF_NAME }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
      
      - name: Build Python protobuf code
        run: |
          devbox run task build-proto:python
      
      - name: Build Python package
        run: |
          devbox run poetry build
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

  publish-cpp:
    name: Build and Publish C++ Package
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: write  # For GitHub Releases
    
    steps:
      - uses: ./.github/actions/setup

      - name: Build C++ protobuf code
        run: |
          devbox run task build-proto:cpp
      
      - name: Create C++ package archive
        run: |
          PACKAGE_NAME="finance-proto-models-cpp-${{ env.GITHUB_REF_NAME }}"
          mkdir -p package/${PACKAGE_NAME}
          
          # Copy generated C++ files
          cp -r build/cpp/* package/${PACKAGE_NAME}/
          
          # Copy proto source files
          mkdir -p package/${PACKAGE_NAME}/proto
          cp -r src/* package/${PACKAGE_NAME}/proto/
          
          # Create tarball
          cd package
          tar -czf ${PACKAGE_NAME}.tar.gz ${PACKAGE_NAME}
          zip -r ${PACKAGE_NAME}.zip ${PACKAGE_NAME}
          cd ..
          
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
      
      - name: Upload C++ package to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            package/${{ env.PACKAGE_NAME }}.tar.gz
            package/${{ env.PACKAGE_NAME }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
