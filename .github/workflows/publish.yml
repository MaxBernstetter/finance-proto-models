name: Publish Packages

on:
  push:
    branches: ['main']
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
jobs:
  setup:
    name: Setup and Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      pypi_version: ${{ steps.version.outputs.pypi_version }}
      display_version: ${{ steps.version.outputs.display_version }}
    steps:
      - name: Determine version
        id: version
        run: |
          # Check if this is a tag push
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ env.GITHUB_REF_NAME }}"
            VERSION=${TAG_NAME#v}  # Remove 'v' prefix if present
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "❌ Invalid version format: $VERSION (expected X.Y.Z)"
              exit 1
            fi
            PYPI_VERSION="$VERSION"
            DISPLAY_VERSION="$VERSION"
          else
            # For commits, use "latest"
            VERSION="latest"
            PYPI_VERSION="0.0.0+latest"
            DISPLAY_VERSION="latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "pypi_version=$PYPI_VERSION" >> $GITHUB_OUTPUT
          echo "display_version=$DISPLAY_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version: $DISPLAY_VERSION (PyPI: $PYPI_VERSION)"

  build-releases:
    name: Build ${{ matrix.package }} package
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        package: [py, cpp]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: true
      
      - name: Cache Poetry dependencies
        if: matrix.package == 'py'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-
      
      - name: Build package
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          PYPI_VERSION="${{ needs.setup.outputs.pypi_version }}"
          if [ "${{ matrix.package }}" == "py" ]; then
            devbox run task release:package:py:${PYPI_VERSION}
          else
            devbox run task release:package:cpp:${VERSION}
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finance-proto-models-${{ matrix.package }}-${{ needs.setup.outputs.display_version }}
          path: |
            release/${{ matrix.package == 'py' && 'python' || 'cpp' }}/*
          retention-days: 30
    
  publish-releases:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    needs: [setup, build-packages]
    permissions:
      contents: write
    if: always() && (needs.build-packages.result == 'success')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: finance-proto-models-*
          merge-multiple: true
          path: artifacts
      
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.setup.outputs.version == 'latest' && 'latest' || format('v{0}', needs.setup.outputs.version) }}
          name: finance-proto-models ${{ needs.setup.outputs.display_version }}
          files: |
            artifacts/**
          draft: false
          prerelease: ${{ needs.setup.outputs.version == 'latest' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}