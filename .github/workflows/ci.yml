name: Publish Packages

on:
  push:
    branches: ['main']
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  setup:
    name: Setup and Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      pypi_version: ${{ steps.version.outputs.pypi_version }}
      display_version: ${{ steps.version.outputs.display_version }}
    steps:
      - name: Determine version
        id: version
        run: |
          # Check if this is a tag push
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ env.GITHUB_REF_NAME }}"
            VERSION=${TAG_NAME#v}  # Remove 'v' prefix if present
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "❌ Invalid version format: $VERSION (expected X.Y.Z)"
              exit 1
            fi
            PYPI_VERSION="$VERSION"
            DISPLAY_VERSION="$VERSION"
          else
            # For commits, use "latest"
            VERSION="latest"
            PYPI_VERSION="0.0.0+latest"
            DISPLAY_VERSION="latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "pypi_version=$PYPI_VERSION" >> $GITHUB_OUTPUT
          echo "display_version=$DISPLAY_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version: $DISPLAY_VERSION (PyPI: $PYPI_VERSION)"

  build:
    name: Build ${{ matrix.package }} package
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        package: [python, cpp]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build release package
        uses: ./.github/actions/build-release
        with:
          package: ${{ matrix.package }}
          version: ${{ needs.setup.outputs.version }}
          pypi_version: ${{ needs.setup.outputs.pypi_version }}
          display_version: ${{ needs.setup.outputs.display_version }}

  test:
    name: Test ${{ matrix.package }} package
    runs-on: ubuntu-latest
    needs: [setup, build]
    strategy:
      matrix:
        package: [python, cpp]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test package
        uses: ./.github/actions/test-release
        with:
          package: ${{ matrix.package }}
          version: ${{ needs.setup.outputs.version }}
          display_version: ${{ needs.setup.outputs.display_version }}
        
  publish:
    name: Publish ${{ matrix.target }} release
    runs-on: ubuntu-latest
    needs: [setup, build, test]
    strategy:
      matrix:
        target: [python, cpp]
    permissions:
      contents: write
    if: always() && (needs.build.result == 'success') && (needs.test.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish release package
        uses: ./.github/actions/publish-release
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.setup.outputs.version }}
          display_version: ${{ needs.setup.outputs.display_version }}