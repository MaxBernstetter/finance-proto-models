name: Publish Packages

on:
  push:
    branches: ['main']  # Triggers on every commit
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'  # Triggers on tags matching X.Y.Z format
      - 'v[0-9]+.[0-9]+.[0-9]+'  # Triggers on tags matching vX.Y.Z format

jobs:
  setup:
    name: Setup and Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      pypi_version: ${{ steps.version.outputs.pypi_version }}
      display_version: ${{ steps.version.outputs.display_version }}
    steps:
      - name: Determine version
        id: version
        run: |
          # Check if this is a tag push
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ env.GITHUB_REF_NAME }}"
            VERSION=${TAG_NAME#v}  # Remove 'v' prefix if present
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "❌ Invalid version format: $VERSION (expected X.Y.Z)"
              exit 1
            fi
            PYPI_VERSION="$VERSION"
            DISPLAY_VERSION="$VERSION"
          else
            # For commits, use "latest"
            VERSION="latest"
            PYPI_VERSION="0.0.0+latest"
            DISPLAY_VERSION="latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "pypi_version=$PYPI_VERSION" >> $GITHUB_OUTPUT
          echo "display_version=$DISPLAY_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version: $DISPLAY_VERSION (PyPI: $PYPI_VERSION)"

  publish-python:
    name: Build and Publish Python Package
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: true
      
      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-
      
      - name: Build Python protobuf code
        run: |
          devbox run task build-proto:python
            
      - name: Create Python package structure
        run: |
          PYPI_VERSION="${{ needs.setup.outputs.pypi_version }}"
          DISPLAY_VERSION="${{ needs.setup.outputs.display_version }}"
          PACKAGE_DIR="python-package"
          PACKAGE_NAME="finance_proto_models"
          
          # Create package directory structure
          mkdir -p ${PACKAGE_DIR}/${PACKAGE_NAME}
          
          # Copy generated Python code into the package directory
          cp -r build/python/* ${PACKAGE_DIR}/${PACKAGE_NAME}/
          
          # Create __init__.py if it doesn't exist
          touch ${PACKAGE_DIR}/${PACKAGE_NAME}/__init__.py
          
          # Create pyproject.toml for the package using Poetry
          cat > ${PACKAGE_DIR}/pyproject.toml << EOF
          [build-system]
          requires = ["poetry-core>=1.0.0"]
          build-backend = "poetry.core.masonry.api"
          
          [tool.poetry]
          name = "finance-proto-models-py"
          version = "${PYPI_VERSION}"
          description = "Python bindings for finance-proto-models protobuf definitions"
          authors = ["Max Bernstetter <max.bernstetter@gmx.net>"]
          readme = "README.md"
          package-mode = true
          packages = [{include = "${PACKAGE_NAME}"}]
          
          [tool.poetry.dependencies]
          python = "^3.12"
          EOF
          
          # Create README for the package
          cat > ${PACKAGE_DIR}/README.md << EOF
          # finance-proto-models-py
          
          Version: ${DISPLAY_VERSION}
          
          Python bindings for finance-proto-models protobuf definitions.
          EOF

      - name: Build Python package with Poetry
        run: |
          devbox run poetry build --directory python-package
          mkdir -p dist
          cp python-package/dist/* dist/
      
      - name: Upload Python package to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.setup.outputs.version == 'latest' && 'latest' || format('v{0}', needs.setup.outputs.version) }}
          name: finance-proto-models-py ${{ needs.setup.outputs.display_version }}
          files: |
            dist/*
          draft: false
          prerelease: ${{ needs.setup.outputs.version == 'latest' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  publish-cpp:
    name: Build and Publish C++ Package
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: true
      
      - name: Build C++ protobuf code
        run: |
          devbox run task build-proto:cpp
      
      - name: Create C++ package archive
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          PACKAGE_NAME="finance-proto-models-cpp-${VERSION}"
          mkdir -p package/${PACKAGE_NAME}
          
          # Copy generated C++ files
          cp -r build/cpp/* package/${PACKAGE_NAME}/
          
          # Copy proto source files
          mkdir -p package/${PACKAGE_NAME}/proto
          cp -r src/* package/${PACKAGE_NAME}/proto/
          
          # Create README for the package
          cat > package/${PACKAGE_NAME}/README.md << EOF
          # finance-proto-models-cpp
          
          Version: ${VERSION}
          
          This package contains the generated C++ code from the finance-proto-models protobuf definitions.
          
          ## Usage
          
          Include the generated headers in your C++ project and link against the protobuf library.
          
          ## Files
          
          - Generated C++ headers and source files
          - Original .proto files in the proto/ directory
          EOF
          
          # Create tarball
          cd package
          tar -czf ${PACKAGE_NAME}.tar.gz ${PACKAGE_NAME}
          zip -r ${PACKAGE_NAME}.zip ${PACKAGE_NAME}
          cd ..
          
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
      
      - name: Upload C++ package to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.setup.outputs.version == 'latest' && 'latest' || format('v{0}', needs.setup.outputs.version) }}
          name: finance-proto-models-cpp ${{ needs.setup.outputs.version }}
          files: |
            package/${{ env.PACKAGE_NAME }}.tar.gz
            package/${{ env.PACKAGE_NAME }}.zip
          draft: false
          prerelease: ${{ needs.setup.outputs.version == 'latest' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}