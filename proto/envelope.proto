syntax = "proto3";

package FinanceProtobufModels;
option go_package = "github.com/MaxBernstetter/finance-proto-models/gen/go/financepb";

// Import the required message and enum definitions
import "price.proto";
import "enum.proto";


message PriceAggregationEnvelope {
    Provider provider = 1;
    MetricType metricType = 2;
    AggregationWindow aggregationWindow = 3;
    PriceData payload = 4;
}
