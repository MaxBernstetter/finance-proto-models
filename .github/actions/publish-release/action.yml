name: 'Publish Release Package'
description: 'Publish a single package (py or cpp) to GitHub Releases'
inputs:
  target:
    description: 'Package target (py or cpp)'
    required: true
  version:
    description: 'Version string'
    required: true
  display_version:
    description: 'Display version string'
    required: true
    
runs:
  using: 'composite'
  steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: finance-proto-models-${{ inputs.target }}-${{ inputs.display_version }}
        path: release/${{ inputs.package }}
    
    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ inputs.version == 'latest' && format('{0}-latest', inputs.target) || format('{0}-v{1}', inputs.target, inputs.version) }}
        name: finance-proto-models-${{ inputs.target }}
        files: release/${{ inputs.target }}/*
        draft: false
        prerelease: ${{ inputs.version == 'latest' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}