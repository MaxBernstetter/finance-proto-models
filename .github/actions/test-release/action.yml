name: 'Test Release Package'
description: 'Test a single package (python or cpp) for release'
inputs:
  package:
    description: 'Package type (python or cpp)'
    required: true
  version:
    description: 'Version string'
    required: true
  display_version:
    description: 'Display version string'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run test script
      shell: bash
      run: |
        bash tests/${{ inputs.package }}/test.sh release/${{ inputs.package }}
