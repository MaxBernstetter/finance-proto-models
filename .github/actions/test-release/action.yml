name: 'Test Release Package'
description: 'Test a single package (python or cpp) for release'
inputs:
  package:
    description: 'Package type (python or cpp)'
    required: true
  version:
    description: 'Version string'
    required: true
  display_version:
    description: 'Display version string'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: finance-proto-models-${{ inputs.package }}-${{ inputs.display_version }}
        path: release/${{ inputs.package }}

    - name: Install devbox
      uses: jetify-com/devbox-install-action@v0.14.0
      with:
        enable-cache: 'true'
    
    - name: Run test script
      shell: bash
      run: |
        devbox run task test:${{ inputs.package }}