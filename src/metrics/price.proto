syntax = "proto3";
package crypto;


message PriceMetaData {
    uint64 timestampMs = 1;
    string symbol = 2;
}

message PriceRaw {

    PriceMetaData metaData = 1;
    float price = 2;
}

message PriceAggregation {

    PriceMetaData metaData = 1;
    uint64 aggregationWindowMs = 2;
    float open = 3;
    float close = 4;
    float high = 5;
    float low = 6;
}

message PriceData {

    oneof priceData {
        PriceRaw priceRaw = 1;
        PriceAggregation priceAggregation = 2;
    }
}
