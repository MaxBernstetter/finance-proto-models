syntax = "proto3";
package FinanceProtobufModels;
option go_package = "github.com/MaxBernstetter/finance-proto-models/gen/go/financepb";

import "metadata.proto"
import "enum.proto"

message PriceData {
    uint64 timestampMs = 1;
    float price = 2;   
    optional MessageMetadata metadata = 3;
}   

message PriceMetric {
    uint64 timestampMs = 1;
    float value = 2;
    StatisticEnum statistic = 3;
    optional MessageMetadata metadata = 4;
}

message OHLC {
    uint64 timestampMs = 1;
    uint64 aggregationWindowMs = 2;
    float open = 3;
    float high = 4;
    float low = 5;
    float close = 6;
    optional MessageMetadata metadata = 7;
    bool bullish = 8;
}

message BollingerBands {
    uint64 timestampMs = 1;
    float upperBand = 2;
    float middleBand = 3;
    float lowerBand = 4;
    optional MessageMetadata metadata = 5;
}
