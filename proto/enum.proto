syntax = "proto3";
package FinanceProtobufModels;
option go_package = "github.com/MaxBernstetter/finance-proto-models/gen/go/financepb";

enum ProviderEnum {
    COINBASE = 0;
}

enum StatisticEnum {
    SMA = 0; // Simple Moving Average
    EMA = 1; // Exponential Moving Average
    RSI = 2; // Relative Strength Index
    MACD = 3; // Moving Average Convergence Divergence
    STOCH = 4; // Stochastic Oscillator
    ADX = 5; // Average Directional Index
    ATR = 6; // Average True Range
}

