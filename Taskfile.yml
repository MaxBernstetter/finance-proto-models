version: '3'

tasks:


  poetry:install:
    desc: Install dependencies
    cmd: poetry install --with dev

  build-proto:*:
    desc: Build protobuf code for the provided target [python, cpp, all]
    vars:
      TARGET: '{{index .MATCH 0}}'
    cmd: bash build.sh {{.TARGET}}

  upload:py:
    desc: Upload Python package to GitHub Packages
    deps:
      - poetry:install
    cmd: |
      poetry run python3 -m twine upload \
        --repository-url https://upload.pkg.github.com/${GITHUB_REPOSITORY} \
        --username ${GITHUB_REPOSITORY_OWNER} \
        --password ${GITHUB_TOKEN} \
        dist/*