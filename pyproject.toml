[project]
name = "finance-proto-models-py"
version = "0.0.0"
description = "Python bindings for finance-proto-models protobuf definitions"
authors = [{ name = "Max Bernstetter", email = "max.bernstetter@gmx.net" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # The 33.5 protoc/libprotobuf generation line maps to Python 6.33.5 runtime line
  # https://protobuf.dev/support/version-support/
  "protobuf>=6.33.5,<7",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["finance_proto_models"]

[tool.hatch.build.targets.sdist]
exclude = [".devbox", ".venv", "venv"]

[tool.uv.sources]
finance_proto_models = { path = "gen/python/finance_proto_models" }
